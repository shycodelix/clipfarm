[package]
name = "clipfarm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "clipfarm desktop app (Rust + egui)"

[[bin]]
name = "clipfarm-app"
path = "src/main.rs"

[dependencies]
clipfarm-core = { path = "../clipfarm-core" }
anyhow.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
egui.workspace = true
eframe = { workspace = true }
image = { workspace = true }

[package.metadata.packager]
product-name = "clipfarm"
identifier = "app.clipfarm.desktop"
publisher = "clipfarm"
description = "Long video in. Shorts out. A local-first Rust clipping studio."
icons = ["../../build/icon.png"]
out-dir = "../../dist"

# The CLI binary is built from the sibling crate. We tell the packager to wrap it
# alongside the app so each installer also ships `clipfarm` (the CLI).
#
# `binaries-dir` is set via the CLI (--binaries-dir) in CI and locally so the
# packager finds the compiled binaries for the right target. When omitted it
# defaults to the out-dir.
binaries = [
  # The desktop app is the main binary the installer is built around.
  { path = "clipfarm-app", main = true },
  # The CLI lives alongside the app so every platform installer ships `clipfarm`.
  { path = "clipfarm" },
]

# Desktop integration is useful on Linux; keep it on by default.
[package.metadata.packager.linux]
generate-desktop-entry = true

# Windows: per-user install keeps the uninstaller and shortcuts user-scoped.
[target.'cfg(windows)'.package.metadata.packager]
short-version = "${CARGO_PACKAGER_VERSION}"
windows-install-mode = "currentUser"
application-verifier = false

# macOS: DMG ships the .app bundle, which contains the CLI inside it at
# Contents/MacOS/clipfarm (cargo-packager puts every binary from the `binaries`
# list into the .app's Contents/MacOS/ directory). The CLI is not on PATH; it is
# available from the app bundle or from a source/build checkout.
[target.'cfg(macos)'.package.metadata.packager]
short-version = "${CARGO_PACKAGER_VERSION}"

# Linux: .deb ships the app and the CLI; version from env.
[target.'cfg(linux)'.package.metadata.packager]
short-version = "${CARGO_PACKAGER_VERSION}"

# Bundled runtime dependencies. The release workflow (.github/workflows/release.yml)
# fetches and verifies these from upstream, places them into the binaries directory
# with triple-suffixed names, and generates a Packager.toml that lists them in the
# `binaries` array so cargo-packager includes them in the installer.
#
# The platform conventions for where the packager places each binary:
#   macOS:   <app>.app/Contents/MacOS/<name>-<triple>
#   Linux:   usr/bin/<name>-<triple>   (.deb; on install the plain Binary is what
#            ends up on PATH, so the user-visible name is the plain one)
#   Windows: $INSTDIR/<name>-<triple>.exe   (next to the app .exe)
#
# The actual files are fetched and verified in CI from these sources:
#   - FFmpeg/ffprobe:  BtbN/FFmpeg-Builds pinned release, GPL static build,
#                       verified against that release's checksums.sha256. Linux and
#                       Windows only; BtbN does not ship macOS builds.
#   - yt-dlp:          yt-dlp standalone release, verified against the release
#                       checksums.
#
# macOS FFmpeg: BtbN does not ship macOS, so the macOS legs keep the existing
# Homebrew fallback until a macOS runner is available and a macOS static source is
# pinned. The runtime resolver (config.rs) already prefers a bundled copy when
# present, so the macOS path is ready once the binary is supplied.
#
# NOTE: externalBinaries is NOT used directly because cargo-packager 0.11.x does
# not resolve those names relative to --binaries-dir. Instead, the release workflow
# generates a Packager.toml with the external binaries listed explicitly in the
# `binaries` array.

# Signing is intentionally left disabled until macOS/Windows code-signing secrets
# are provided. See docs/PLATFORM.md for the recommended signing setup.
