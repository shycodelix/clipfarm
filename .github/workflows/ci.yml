name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Unit tests
        run: cargo test --workspace --lib

      - name: Build desktop app
        run: cargo build -p clipfarm-app

      - name: FFmpeg integration test (Linux)
        if: runner.os == 'Linux'
        env:
          CLIPFARM_TEST_FFMPEG: /usr/bin/ffmpeg
        run: cargo test -p clipfarm-core --test ffmpeg_pipeline -- --nocapture

      - name: CLI smoke test
        run: |
          cargo run -p clipfarm-cli -- doctor
          cargo run -p clipfarm-cli -- trends
