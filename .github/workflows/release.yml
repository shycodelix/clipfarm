name: release

# Build platform installers on every tag and on workflow_dispatch. Each installer
# ships the desktop app and the `clipfarm` CLI so the CLI is available from the
# install location on every platform. Windows keeps its Start menu/Desktop shortcuts
# and uninstaller; macOS puts the CLI next to the .app in the DMG; Linux puts the CLI
# under /usr/bin so it is on PATH after install.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Linux + Windows are required for a release. macOS runners are
  # intermittently unavailable on shared GitHub runners, so macOS is
  # built in a separate matrix that does not block the attach job.
  installers:
    name: build (${{ matrix.display }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Linux .deb (x86_64)
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: deb

          - display: Windows NSIS (x86_64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Prereqs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libxkbcommon-dev libwayland-dev libx11-dev

      - name: Prereqs (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # v0.2.0 -> 0.2.0
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-dev"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p clipfarm-cli -p clipfarm-app

      - name: Package
        shell: bash
        env:
          CARGO_PACKAGER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo install cargo-packager --locked
          cargo packager --release \
            --target ${{ matrix.target }} \
            -p clipfarm-app \
            -f ${{ matrix.formats }} \
            --out-dir ../../dist \
            --binaries-dir ../../target/${{ matrix.target }}/release

      - name: Rebuild .deb with dpkg-deb (cargo-packager ar header fix)
        if: matrix.formats == 'deb'
        run: |
          STAGING=$(find crates/clipfarm-app/dist/.cargo-packager/deb dist/.cargo-packager/deb -type d -name "*amd64*" -o -name "*$(echo ${{ matrix.target }} | tr '-' '_')*" 2>/dev/null | head -1)
          if [ -z "$STAGING" ]; then echo "ERROR: staging dir not found"; exit 1; fi
          echo "Staging: $STAGING"
          mkdir -p rebuilt/DEBIAN
          cp "$STAGING/control/control" rebuilt/DEBIAN/
          cp "$STAGING/control/md5sums" rebuilt/DEBIAN/
          cp -r "$STAGING/data" rebuilt/
          dpkg-deb --build rebuilt dist/clipfarm-${{ matrix.target }}.deb

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: clipfarm-${{ matrix.formats }}-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  installers-macos:
    name: build (${{ matrix.display }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: macOS DMG (x86_64)
            runner: macos-latest
            target: x86_64-apple-darwin
            formats: dmg

          - display: macOS DMG (ARM64)
            runner: macos-latest
            target: aarch64-apple-darwin
            formats: dmg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Prereqs (macOS)
        run: brew install ffmpeg

      - name: Version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-dev"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p clipfarm-cli -p clipfarm-app

      - name: Package
        shell: bash
        env:
          CARGO_PACKAGER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo install cargo-packager --locked
          cargo packager --release \
            --target ${{ matrix.target }} \
            -p clipfarm-app \
            -f ${{ matrix.formats }} \
            --out-dir ../../dist \
            --binaries-dir ../../target/${{ matrix.target }}/release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: clipfarm-${{ matrix.formats }}-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  attach:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts for release
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -1 release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
